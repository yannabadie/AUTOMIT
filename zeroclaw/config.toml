# =============================================================================
# ZEROCLAW — Agent IT Proactif — Motherson Aerospace
# Configuration: ~/.zeroclaw/config.toml
# Role: Surveillance ERP + AD + M365, corrélation d'alertes, triage incidents
# =============================================================================

# --- LLM Provider -----------------------------------------------------------
# Primary: OpenAI Codex via ChatGPT Pro subscription (OAuth, zero extra cost)
# Auth: zeroclaw auth login --provider openai-codex --device-code (on host)
# Tokens: ~/.zeroclaw/auth-profiles.json (chiffré, auto-refresh)
default_provider = "openai-codex"
default_model = "gpt-5.3-codex"
default_temperature = 0.2  # Bas = plus déterministe pour les décisions IT
api_url = "http://openai-proxy/backend-api/codex"  # Sidecar nginx → chatgpt.com/backend-api/codex (Codex API endpoint)

# Fallback 1: Gemini 2.5 Flash (free tier API — si quotas Codex saturés)
# default_provider = "gemini"
# default_model = "gemini-2.5-flash"

# Fallback 2: Ollama (100% local, air-gap compatible)
# Activer avec: docker compose --profile local-llm up
# default_provider = "ollama"
# default_model = "qwen2.5-coder:14b"

# --- Memory ------------------------------------------------------------------
[memory]
backend = "sqlite"
auto_save = true
embedding_provider = "ollama"                  # Embeddings 100% locaux via Ollama sidecar
embedding_model = "snowflake-arctic-embed2"    # Multilingue FR/EN, 74 langues, Apache 2.0
vector_weight = 0.7
keyword_weight = 0.3

# --- Gateway -----------------------------------------------------------------
[gateway]
host = "0.0.0.0"  # Bind all interfaces (required for Docker port forwarding)
port = 42617
require_pairing = true
allow_public_bind = true  # Required when host != 127.0.0.1 in Docker

# --- Autonomy ----------------------------------------------------------------
[autonomy]
level = "supervised"  # "read_only" | "supervised" | "full"
workspace_only = true
# Commandes shell autorisées SANS validation humaine
allowed_commands = [
    "curl", "ping", "nslookup", "cat", "ls", "grep", "find",
    "echo", "pwd", "wc", "head", "tail", "date",
]
# Chemins interdits (défaut ZeroClaw + ajustements)
forbidden_paths = [
    "/etc", "/root", "/usr", "/bin", "/sbin", "/lib",
    "/boot", "/dev", "/proc", "/sys", "/var",
    "~/.ssh", "~/.gnupg", "~/.aws", "~/.config",
]
# Répertoires accessibles hors workspace
allowed_roots = ["/opt/scripts", "/tmp"]
# Garde-fous
max_actions_per_hour = 20
max_cost_per_day_cents = 500
require_approval_for_medium_risk = true
block_high_risk_commands = true

# --- Security ----------------------------------------------------------------
[security.otp]
enabled = false

[security.estop]
enabled = true

# --- Heartbeat ---------------------------------------------------------------
# v0.1.7: Le prompt heartbeat est dans HEARTBEAT.md, pas dans config.toml
[heartbeat]
enabled = true
interval_minutes = 5  # Toutes les 5 minutes

# --- Runtime -----------------------------------------------------------------
[runtime]
kind = "native"  # "native" | "docker"
# En production, utiliser "docker" pour isoler l'exécution des commandes
