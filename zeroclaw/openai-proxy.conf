server {
    listen 80;
    server_name _;

    # ChatGPT backend — Codex API for ChatGPT subscription users
    # Endpoint: /backend-api/codex/responses (NOT /v1/responses)
    # The openai-codex provider routes here (NOT api.openai.com)
    location ~ ^/backend-api {
        proxy_pass https://chatgpt.com;
        proxy_set_header Host chatgpt.com;
        proxy_set_header Connection '';
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        # SSE streaming support (Codex API requires stream=true)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        chunked_transfer_encoding on;
    }

    # API calls — routed to chatgpt.com for ChatGPT subscription OAuth
    location ~ ^/v1 {
        proxy_pass https://chatgpt.com;
        proxy_set_header Host chatgpt.com;
        proxy_set_header User-Agent "codex-cli/0.104.0";
        proxy_set_header Accept "application/json";
        proxy_set_header Origin "https://chatgpt.com";
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    }

    # OAuth token exchange
    location ~ ^/oauth {
        proxy_pass https://auth.openai.com;
        proxy_set_header Host auth.openai.com;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }
}
