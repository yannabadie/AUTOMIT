# =============================================================================
# MOTHERSON AEROSPACE — IT Automation Stack
# Kestra (Orchestrator) + ZeroClaw (Proactive Agent) + Supporting Services
# =============================================================================
# Usage: docker compose up -d
# Kestra UI:       http://localhost:8080
# ZeroClaw Gateway: http://localhost:42617 (localhost only, pairing required)
# Prometheus:       http://localhost:9090
# Grafana:          http://localhost:3000
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # KESTRA — Orchestration Engine
  # ---------------------------------------------------------------------------
  kestra:
    image: kestra/kestra:latest
    pull_policy: always
    user: "root"
    command: server local
    ports:
      - "8080:8080"
      - "8081:8081"  # Management port
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./kestra/flows:/app/flows  # Auto-load flows
    environment:
      KESTRA_CONFIGURATION: |
        kestra:
          server:
            basic-auth:
              enabled: true
              username: yann.abadie@motherson-mas.com
              password: ${KESTRA_ADMIN_PASSWORD:-Ch@ngeMeN0w!}
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          queue:
            type: postgres
          datasources:
            postgres:
              url: jdbc:postgresql://postgres:5432/kestra
              driverClassName: org.postgresql.Driver
              username: kestra
              password: ${POSTGRES_PASSWORD:-kestra_secret}
          # Auto-import flows from mounted directory
          flows:
            path: /app/flows
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - motherson-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # POSTGRESQL — Kestra Backend
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kestra_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - motherson-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # OPENAI PROXY — TLS termination sidecar for corporate proxy environments
  # ZeroClaw (rustls+webpki-roots) cannot trust the corporate MITM CA.
  # This nginx reverse proxy handles TLS with the system CA store.
  # ---------------------------------------------------------------------------
  openai-proxy:
    image: nginx:alpine
    container_name: zeroclaw-openai-proxy
    ports:
      - "18080:80"  # Exposed to host for auth token exchange (curl --ssl-no-revoke alternative)
    volumes:
      - ./zeroclaw/openai-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./zeroclaw/ca-bundle.pem:/usr/local/share/ca-certificates/corporate-ca.crt:ro
    command: sh -c "update-ca-certificates && nginx -g 'daemon off;'"
    networks:
      - motherson-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ZEROCLAW — Proactive IT Agent (daemon mode)
  # v0.1.7 — debian:trixie-slim + OpenAI Codex OAuth (ChatGPT Pro)
  # Auth: zeroclaw auth login --provider openai-codex --device-code (on host)
  # Host ~/.zeroclaw mounted into container (auth-profiles.json + .secret_key)
  # ---------------------------------------------------------------------------
  zeroclaw-erp-agent:
    build:
      context: ./zeroclaw
      dockerfile: Dockerfile
    image: automit/zeroclaw:0.1.7
    ports:
      - "42617:42617" # Gateway (localhost only)
    volumes:
      # Host .zeroclaw directory — contains auth-profiles.json, .secret_key, data
      - ${ZEROCLAW_HOST_HOME}:/home/zeroclaw/.zeroclaw:rw
      # Agent config (read-only, overlays on host dir)
      - ./zeroclaw/config.toml:/home/zeroclaw/.zeroclaw/config.toml:ro
      - ./zeroclaw/IDENTITY.md:/home/zeroclaw/.zeroclaw/IDENTITY.md:ro
      - ./zeroclaw/HEARTBEAT.md:/home/zeroclaw/.zeroclaw/HEARTBEAT.md:ro
      # Scripts the agent can execute (read-only)
      - ./scripts:/opt/scripts:ro
    environment:
      - ZEROCLAW_HOME=/home/zeroclaw/.zeroclaw
      - KESTRA_WEBHOOK_URL=http://kestra:8080/api/v1/executions/webhook
      - KESTRA_WEBHOOK_KEY=${KESTRA_WEBHOOK_KEY}
      - KESTRA_AUTH_USER=yann.abadie@motherson-mas.com
      - KESTRA_AUTH_PASSWORD=${KESTRA_ADMIN_PASSWORD:-Ch@ngeMeN0w!}
      # LLM Fallbacks
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OLLAMA_BASE_URL=http://ollama:11434
    networks:
      - motherson-net
    depends_on:
      - kestra
      - openai-proxy
    restart: unless-stopped
    # Security hardening
    read_only: true
    tmpfs:
      - /tmp:size=100M
    mem_limit: 64m
    cpus: 0.5

  # ---------------------------------------------------------------------------
  # OLLAMA — Local LLM (optional, for air-gap / confidential workloads)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - motherson-net
    restart: unless-stopped
    profiles:
      - local-llm  # Only starts with: docker compose --profile local-llm up
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # PROMETHEUS — Metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - motherson-net
    restart: unless-stopped
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # PUSHGATEWAY — Custom metrics from Kestra flows (ERP health, M365 status)
  # ---------------------------------------------------------------------------
  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"
    networks:
      - motherson-net
    restart: unless-stopped
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # GRAFANA — Dashboards (auto-provisioned)
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/automit-overview.json
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./docs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - motherson-net
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  kestra-data:
  postgres-data:
  ollama-models:
  grafana-data:

networks:
  motherson-net:
    driver: bridge
