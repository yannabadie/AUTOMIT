# =============================================================================
# MOTHERSON AEROSPACE — IT Automation Stack
# Kestra (Orchestrator) + ZeroClaw (Proactive Agent) + Supporting Services
# =============================================================================
# Usage: docker compose up -d
# Kestra UI:       http://localhost:8080
# ZeroClaw Gateway: http://localhost:42617 (localhost only, pairing required)
# Prometheus:       http://localhost:9090
# Grafana:          http://localhost:3000
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # KESTRA — Orchestration Engine
  # ---------------------------------------------------------------------------
  kestra:
    image: kestra/kestra:latest
    pull_policy: always
    user: "root"
    command: server local
    ports:
      - "8080:8080"
      - "8081:8081"  # Management port
    volumes:
      - kestra-data:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./kestra/flows:/app/flows  # Auto-load flows
    environment:
      KESTRA_CONFIGURATION: |
        kestra:
          server:
            basic-auth:
              enabled: true
              username: admin
              password: ${KESTRA_ADMIN_PASSWORD:-Ch@ngeMeN0w!}
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: /app/storage
          queue:
            type: postgres
          datasources:
            postgres:
              url: jdbc:postgresql://postgres:5432/kestra
              driverClassName: org.postgresql.Driver
              username: kestra
              password: ${POSTGRES_PASSWORD:-kestra_secret}
          # Auto-import flows from mounted directory
          flows:
            path: /app/flows
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - motherson-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # POSTGRESQL — Kestra Backend
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kestra_secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - motherson-net
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # ZEROCLAW — Proactive IT Agent (daemon mode)
  # ---------------------------------------------------------------------------
  # NOTE: ZeroClaw is a Rust binary. Two options:
  #   1. Pre-built binary mounted from host (recommended for PoC)
  #   2. Build from source in multi-stage Dockerfile (production)
  # This config assumes option 1: binary installed on host at /usr/local/bin/zeroclaw
  # ---------------------------------------------------------------------------
  zeroclaw-erp-agent:
    image: rust:1.83-slim-bookworm
    entrypoint: ["/opt/zeroclaw/zeroclaw", "daemon"]
    volumes:
      # Mount pre-compiled zeroclaw binary
      - ${ZEROCLAW_BIN_PATH:-/usr/local/bin/zeroclaw}:/opt/zeroclaw/zeroclaw:ro
      # Agent workspace & config
      - ./zeroclaw:/home/zeroclaw/.zeroclaw
      # Scripts the agent can execute (read-only)
      - ./scripts:/opt/scripts:ro
    environment:
      - ZEROCLAW_HOME=/home/zeroclaw/.zeroclaw
      - KESTRA_WEBHOOK_URL=http://kestra:8080/api/v1/executions/webhook
      - KESTRA_WEBHOOK_KEY=${KESTRA_WEBHOOK_KEY:-motherson-erp-wh-key-2026}
      # LLM Provider — pick one:
      # Option A: Gemini (cloud)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      # Option B: Ollama (local)
      - OLLAMA_BASE_URL=http://ollama:11434
      # Option C: OpenRouter (multi-provider)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    networks:
      - motherson-net
    depends_on:
      - kestra
    restart: unless-stopped
    # Security hardening
    read_only: true
    tmpfs:
      - /tmp:size=100M
    mem_limit: 64m
    cpus: 0.5

  # ---------------------------------------------------------------------------
  # OLLAMA — Local LLM (optional, for air-gap / confidential workloads)
  # ---------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - motherson-net
    restart: unless-stopped
    profiles:
      - local-llm  # Only starts with: docker compose --profile local-llm up
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ---------------------------------------------------------------------------
  # PROMETHEUS — Metrics collection
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - motherson-net
    restart: unless-stopped
    profiles:
      - monitoring

  # ---------------------------------------------------------------------------
  # GRAFANA — Dashboards
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    networks:
      - motherson-net
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  kestra-data:
  postgres-data:
  ollama-models:
  grafana-data:

networks:
  motherson-net:
    driver: bridge
