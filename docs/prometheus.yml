# =============================================================================
# Prometheus — AutomIT Scraping Configuration
# =============================================================================
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # --- Kestra management metrics ---
  # Built-in Micrometer metrics exposed on management port
  - job_name: "kestra"
    metrics_path: /prometheus
    static_configs:
      - targets: ["kestra:8081"]
        labels:
          service: kestra
          environment: production

  # --- Prometheus self-monitoring ---
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # --- Pushgateway for custom metrics (health checks, ERP status) ---
  - job_name: "pushgateway"
    honor_labels: true
    static_configs:
      - targets: ["pushgateway:9091"]
        labels:
          service: automit-custom
