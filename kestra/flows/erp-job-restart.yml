# =============================================================================
# FLOW: ERP Integration Job Restart
# Triggered by: ZeroClaw agent webhook OR manual
# Action: Restarts failed CEGID/Sage X3 integration jobs
# Autonomy Level: L1 (pre-approved, no human validation needed)
# =============================================================================
id: erp-job-restart
namespace: motherson.it.erp

description: |
  Relance automatique des jobs d'intégration ERP (CEGID XRP Sprint / Sage X3).
  Déclenché par l'agent ZeroClaw quand il détecte des échecs consécutifs.
  Niveau d'autonomie L1 : action pré-approuvée, exécution sans validation humaine.

labels:
  team: it-ops
  criticality: medium
  autonomy: L1
  erp: cegid-sage

sla:
  - id: max_execution_time
    type: MAX_DURATION
    duration: PT10M
    behavior: CANCEL

inputs:
  - id: erp_system
    type: SELECT
    required: true
    defaults: "cegid"
    description: "ERP cible: cegid | sage_x3"
    values:
      - cegid
      - sage_x3

  - id: job_name
    type: STRING
    required: true
    description: "Nom du job à relancer (ex: IMPORT_COMMANDES, SYNC_STOCK)"

  - id: failure_count
    type: INT
    required: true
    defaults: 1
    description: "Nombre d'échecs consécutifs détectés par l'agent"

  - id: agent_analysis
    type: STRING
    required: false
    description: "Analyse contextuelle fournie par l'agent ZeroClaw"

  - id: correlation_id
    type: STRING
    required: false
    description: "ID de corrélation ZeroClaw pour traçabilité"

variables:
  max_retries: 3
  retry_delay_seconds: 30
  teams_webhook_url: "{{ secret('TEAMS_WEBHOOK_URL') }}"

tasks:
  # -------------------------------------------------------------------------
  # TODO: Anti-storm cooldown (requires io.kestra.plugin.kv plugin)
  # Uncomment when plugin is installed
  # - id: check_restart_cooldown
  #   ...
  # -------------------------------------------------------------------------

  # -------------------------------------------------------------------------
  # 1. Log l'intervention de l'agent
  # -------------------------------------------------------------------------
  - id: log_agent_trigger
    type: io.kestra.plugin.core.log.Log
    message: |
      🤖 Agent ZeroClaw - ERP Job Restart
      ERP: {{ inputs.erp_system }}
      Job: {{ inputs.job_name }}
      Échecs détectés: {{ inputs.failure_count }}
      Analyse agent: {{ inputs.agent_analysis ?? 'N/A' }}
      Correlation ID: {{ inputs.correlation_id ?? 'manual' }}

  # -------------------------------------------------------------------------
  # 2. Vérifier l'état actuel du job ERP
  # -------------------------------------------------------------------------
  - id: check_job_status
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: automit/python-erp:3.12
    env:
      CEGID_MCP_URL: "{{ secret('MCP_CEGID_ORACLE_URL') }}"
      CEGID_MCP_TOKEN: "{{ secret('MCP_CEGID_ORACLE_TOKEN') }}"
      X3_MCP_URL: "{{ secret('X3_MCP_URL') }}"
      X3_MCP_TOKEN: "{{ secret('X3_MCP_TOKEN') }}"
    script: |
      import json
      import os
      import sys
      import requests
      from lib.mcp_client import mcp_call, parse_mcp_query_result
      from lib.logging import log_info, log_warn, log_error

      erp = "{{ inputs.erp_system }}"
      job = "{{ inputs.job_name }}"

      status = {
          "erp": erp, "job": job,
          "status": "UNKNOWN", "can_restart": False
      }

      # --- CEGID XRP Sprint (via MCP cegid-oracle) ---
      if erp == "cegid":
          mcp_url = os.environ["CEGID_MCP_URL"]
          mcp_token = os.environ["CEGID_MCP_TOKEN"]
          try:
              sql = f"""
                  SELECT TOP 1
                      j.name,
                      h.run_status,
                      h.message,
                      CAST(CAST(h.run_date AS VARCHAR) + ' ' +
                           STUFF(STUFF(RIGHT('000000' + CAST(h.run_time AS VARCHAR), 6),
                           3, 0, ':'), 6, 0, ':') AS DATETIME) AS last_run
                  FROM msdb.dbo.sysjobhistory h
                  JOIN msdb.dbo.sysjobs j ON h.job_id = j.job_id
                  WHERE j.name LIKE '%{job}%'
                  AND h.step_id = 0
                  ORDER BY h.instance_id DESC
              """
              result = mcp_call(mcp_url, mcp_token, "query_database", {"sql": sql, "limit": 1})
              rows = parse_mcp_query_result(result)

              if rows:
                  row = rows[0]
                  if isinstance(row, dict):
                      run_status = row.get("run_status", -1)
                      run_status_map = {0: "FAILED", 1: "SUCCESS", 2: "RETRY", 3: "CANCELLED"}
                      status["status"] = run_status_map.get(run_status, "UNKNOWN")
                      status["error_message"] = str(row.get("message", ""))[:500]
                      status["last_run"] = str(row.get("last_run", ""))
                      status["can_restart"] = status["status"] in ("FAILED", "CANCELLED")
                  elif isinstance(row, (list, tuple)) and len(row) >= 2:
                      run_status_map = {0: "FAILED", 1: "SUCCESS", 2: "RETRY", 3: "CANCELLED"}
                      status["status"] = run_status_map.get(row[1], "UNKNOWN")
                      status["error_message"] = str(row[2])[:500] if len(row) > 2 and row[2] else ""
                      status["last_run"] = str(row[3]) if len(row) > 3 and row[3] else ""
                      status["can_restart"] = status["status"] in ("FAILED", "CANCELLED")
              else:
                  status["status"] = "NOT_FOUND"
                  status["error_message"] = f"Aucun job correspondant a '{job}'"
                  status["can_restart"] = False

          except Exception as e:
              status["status"] = "ERROR"
              status["error_message"] = str(e)
              status["can_restart"] = False

      # --- Sage X3 (via MCP x3-oracle) ---
      elif erp == "sage_x3":
          try:
              result = mcp_call(
                  os.environ["X3_MCP_URL"], os.environ["X3_MCP_TOKEN"],
                  "batch_status", {"job_name": job}
              )
              if isinstance(result, dict):
                  status["status"] = result.get("status", "UNKNOWN")
                  status["error_message"] = result.get("error", "")
                  status["last_run"] = result.get("last_run", "")
                  status["can_restart"] = result.get("can_restart", False)
              else:
                  status["status"] = "MCP_RESPONSE"
                  status["detail"] = str(result)[:500]
                  status["can_restart"] = True
          except Exception as e:
              status["status"] = "ERROR"
              status["error_message"] = str(e)

      from kestra import Kestra
      Kestra.outputs(status)

      if not status["can_restart"]:
          log_error("Job ne peut pas etre relance", erp=erp, job=job, reason=status.get("error_message", ""))
          sys.exit(1)

      log_info("Job peut etre relance", erp=erp, job=job, current_status=status["status"])

  # -------------------------------------------------------------------------
  # 3. Tenter le restart du job
  # -------------------------------------------------------------------------
  - id: restart_job
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: automit/python-erp:3.12
    env:
      CEGID_MCP_URL: "{{ secret('MCP_CEGID_ORACLE_URL') }}"
      CEGID_MCP_TOKEN: "{{ secret('MCP_CEGID_ORACLE_TOKEN') }}"
      X3_MCP_URL: "{{ secret('X3_MCP_URL') }}"
      X3_MCP_TOKEN: "{{ secret('X3_MCP_TOKEN') }}"
    script: |
      import json
      import os
      import sys
      import requests
      from lib.mcp_client import mcp_call
      from lib.logging import log_info, log_warn, log_error

      erp = "{{ inputs.erp_system }}"
      job = "{{ inputs.job_name }}"
      result = {"erp": erp, "job": job, "success": False}

      # --- CEGID XRP Sprint (via MCP cegid-oracle) ---
      if erp == "cegid":
          mcp_url = os.environ["CEGID_MCP_URL"]
          mcp_token = os.environ["CEGID_MCP_TOKEN"]
          try:
              # Relancer le job SQL Agent via query_database (EXEC sp_start_job)
              sql = f"EXEC msdb.dbo.sp_start_job @job_name = N'{job}'"
              resp_data = mcp_call(mcp_url, mcp_token, "query_database", {"sql": sql})
              result["success"] = True
              result["message"] = f"Job '{job}' demarre via MCP cegid-oracle (sp_start_job)"
              result["mcp_response"] = str(resp_data)[:500]
              log_info("Job relance via MCP cegid-oracle", erp="cegid", job=job)
          except Exception as e:
              result["error"] = str(e)
              log_error("Echec relance job", erp="cegid", job=job, error=str(e))
              sys.exit(1)

      # --- Sage X3 (via MCP x3-oracle) ---
      elif erp == "sage_x3":
          try:
              resp_data = mcp_call(
                  os.environ["X3_MCP_URL"], os.environ["X3_MCP_TOKEN"],
                  "batch_restart", {"job_name": job}
              )
              result["success"] = True
              result["mcp_response"] = resp_data if isinstance(resp_data, (dict, str)) else str(resp_data)
              log_info("Job relance via MCP x3-oracle", erp="sage_x3", job=job)
          except Exception as e:
              result["error"] = str(e)
              log_error("Echec relance job", erp="sage_x3", job=job, error=str(e))
              sys.exit(1)

      from kestra import Kestra
      Kestra.outputs(result)
    retry:
      maxAttempt: 3
      type: constant
      interval: PT30S

  # -------------------------------------------------------------------------
  # 4. Vérifier le résultat post-restart
  # -------------------------------------------------------------------------
  - id: verify_restart
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      image: automit/python-erp:3.12
    env:
      CEGID_MCP_URL: "{{ secret('MCP_CEGID_ORACLE_URL') }}"
      CEGID_MCP_TOKEN: "{{ secret('MCP_CEGID_ORACLE_TOKEN') }}"
      X3_MCP_URL: "{{ secret('X3_MCP_URL') }}"
      X3_MCP_TOKEN: "{{ secret('X3_MCP_TOKEN') }}"
    script: |
      import json
      import os
      import time
      import requests
      from lib.mcp_client import mcp_call, parse_mcp_query_result
      from lib.logging import log_info, log_warn, log_error

      erp = "{{ inputs.erp_system }}"
      job = "{{ inputs.job_name }}"

      log_info("Attente 60s pour verification post-restart", erp=erp, job=job)
      time.sleep(60)

      result = {"job": job, "post_restart_status": "UNKNOWN", "verified": False}

      # --- CEGID XRP Sprint (via MCP cegid-oracle) ---
      if erp == "cegid":
          mcp_url = os.environ["CEGID_MCP_URL"]
          mcp_token = os.environ["CEGID_MCP_TOKEN"]
          try:
              sql = f"""
                  SELECT TOP 1 h.run_status
                  FROM msdb.dbo.sysjobhistory h
                  JOIN msdb.dbo.sysjobs j ON h.job_id = j.job_id
                  WHERE j.name LIKE '%{job}%' AND h.step_id = 0
                  ORDER BY h.instance_id DESC
              """
              mcp_result = mcp_call(mcp_url, mcp_token, "query_database", {"sql": sql, "limit": 1})
              rows = parse_mcp_query_result(mcp_result)

              if rows:
                  row = rows[0]
                  status_map = {0: "FAILED", 1: "SUCCESS", 2: "RETRY", 3: "CANCELLED"}
                  run_status = row.get("run_status", row[0] if isinstance(row, (list, tuple)) else -1)
                  result["post_restart_status"] = status_map.get(run_status, "UNKNOWN")
                  result["verified"] = True
          except Exception as e:
              result["error"] = str(e)

      # --- Sage X3 (via MCP x3-oracle) ---
      elif erp == "sage_x3":
          try:
              data = mcp_call(
                  os.environ["X3_MCP_URL"], os.environ["X3_MCP_TOKEN"],
                  "batch_status", {"job_name": job}
              )
              result["post_restart_status"] = data.get("status", "UNKNOWN") if isinstance(data, dict) else "MCP_OK"
              result["verified"] = True
          except Exception as e:
              result["error"] = str(e)

      from kestra import Kestra
      Kestra.outputs(result)
      log_info("Verification post-restart terminee", erp=erp, job=job, post_restart_status=result["post_restart_status"], verified=result["verified"])

  # -------------------------------------------------------------------------
  # 5. Notification Teams
  # -------------------------------------------------------------------------
  - id: notify_teams
    type: io.kestra.plugin.core.http.Request
    uri: "{{ vars.teams_webhook_url }}"
    method: POST
    contentType: application/json
    body: |
      {
        "@type": "MessageCard",
        "themeColor": "00CC00",
        "summary": "ERP Job Restart - {{ inputs.job_name }}",
        "sections": [{
          "activityTitle": "🤖 Agent IT - Relance automatique ERP",
          "facts": [
            {"name": "ERP", "value": "{{ inputs.erp_system | upper }}"},
            {"name": "Job", "value": "{{ inputs.job_name }}"},
            {"name": "Échecs avant relance", "value": "{{ inputs.failure_count }}"},
            {"name": "Statut", "value": "✅ Relancé avec succès"},
            {"name": "Analyse agent", "value": "{{ inputs.agent_analysis ?? 'Relance automatique' }}"},
            {"name": "Execution ID", "value": "{{ execution.id }}"}
          ]
        }]
      }

  # -------------------------------------------------------------------------
  # TODO: Record restart timestamp (requires io.kestra.plugin.kv plugin)
  # - id: set_restart_timestamp
  #   type: io.kestra.plugin.kv.Set
  #   key: erp_last_restart_ts
  #   value: "{{ now() }}"
  #   namespace: motherson.it.erp
  #   overwrite: true
  # -------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# TRIGGERS
# ---------------------------------------------------------------------------
triggers:
  # Webhook pour l'agent ZeroClaw
  - id: zeroclaw_webhook
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('WEBHOOK_KEY_ERP_RESTART') }}"

  # Fallback: schedule pour vérification périodique
  - id: scheduled_check
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/15 * * * *"  # Toutes les 15 minutes
    disabled: true  # Activer si nécessaire
