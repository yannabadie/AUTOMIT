# =============================================================================
# FLOW: ERP Health Check — Surveillance continue
# Triggered by: Schedule (cron 5min) + ZeroClaw webhook
# Action: Collecte métriques ERP, détecte anomalies, alimente l'agent
# Autonomy Level: Observation (pas d'action corrective)
# =============================================================================
id: erp-health-check
namespace: motherson.it.erp

description: |
  Surveillance santé ERP — collecte métriques CEGID & Sage X3 toutes les 5 min.
  Les résultats sont envoyés au gateway ZeroClaw pour analyse proactive.
  Ce flow ne prend AUCUNE action corrective — il observe et remonte.

labels:
  team: it-ops
  criticality: high
  autonomy: observation
  erp: cegid-sage

tasks:
  # -------------------------------------------------------------------------
  # 1. Check CEGID XRP Sprint (via MCP cegid-oracle)
  # Accès SQL read-only via le MCP server — pas de connexion directe
  # -------------------------------------------------------------------------
  - id: check_cegid
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: automit/python-erp:3.12
    env:
      CEGID_MCP_URL: "{{ secret('MCP_CEGID_ORACLE_URL') }}"
      CEGID_MCP_TOKEN: "{{ secret('MCP_CEGID_ORACLE_TOKEN') }}"
    script: |
      import json
      import os
      import time
      import requests
      from datetime import datetime

      mcp_url = os.environ["CEGID_MCP_URL"]
      mcp_token = os.environ["CEGID_MCP_TOKEN"]
      headers = {
          "X-MCP-TOKEN": mcp_token,
          "Content-Type": "application/json",
          "Accept": "application/json"
      }

      checks = {
          "timestamp": datetime.utcnow().isoformat() + "Z",
          "erp": "cegid",
          "checks": {},
          "overall_status": "HEALTHY"
      }

      def mcp_call(tool_name, arguments):
          """Call a CEGID Oracle MCP tool via JSON-RPC."""
          payload = {
              "jsonrpc": "2.0", "id": 1,
              "method": "tools/call",
              "params": {"name": tool_name, "arguments": arguments}
          }
          resp = requests.post(mcp_url, json=payload, headers=headers, timeout=30)
          if resp.status_code == 200:
              data = resp.json()
              if "error" in data:
                  raise Exception(f"MCP error: {data['error']}")
              return data.get("result", data)
          raise Exception(f"HTTP {resp.status_code}: {resp.text[:300]}")

      def mcp_query(sql):
          """Execute a read-only SQL query via MCP query_database tool."""
          result = mcp_call("query_database", {"sql": sql, "limit": 100})
          return result

      # --- Test connexion MCP ---
      try:
          t0 = time.time()
          resp = requests.get(mcp_url.rstrip("/"), headers=headers, timeout=15)
          response_ms = round((time.time() - t0) * 1000)
          checks["checks"]["mcp_connection"] = {
              "status": "OK" if resp.status_code < 500 else "CRITICAL",
              "response_time_ms": response_ms
          }
      except Exception as e:
          checks["checks"]["mcp_connection"] = {"status": "CRITICAL", "error": str(e)}
          checks["overall_status"] = "CRITICAL"

      # --- Sessions actives ---
      if checks["checks"].get("mcp_connection", {}).get("status") == "OK":
          try:
              result = mcp_query(
                  "SELECT COUNT(*) AS cnt FROM sys.dm_exec_sessions WHERE is_user_process = 1"
              )
              # Parse result — MCP returns content array with text
              if isinstance(result, dict) and "content" in result:
                  for item in result["content"]:
                      if item.get("type") == "text":
                          data = json.loads(item["text"]) if isinstance(item["text"], str) else item["text"]
                          if isinstance(data, dict) and "rows" in data:
                              count = data["rows"][0][0] if data["rows"] else 0
                          elif isinstance(data, list) and data:
                              count = data[0].get("cnt", data[0].get("", 0))
                          else:
                              count = data
                          checks["checks"]["active_sessions"] = {
                              "count": count, "max_allowed": 50,
                              "status": "WARNING" if isinstance(count, int) and count > 40 else "OK"
                          }
                          break
              else:
                  checks["checks"]["active_sessions"] = {"status": "OK", "raw": str(result)[:300]}
          except Exception as e:
              checks["checks"]["active_sessions"] = {"status": "WARNING", "error": str(e)}

      # --- Jobs batch ---
      if checks["checks"].get("mcp_connection", {}).get("status") == "OK":
          try:
              result = mcp_query("""
                  SELECT
                      (SELECT COUNT(*) FROM msdb.dbo.sysjobactivity ja
                       JOIN msdb.dbo.sysjobs j ON ja.job_id = j.job_id
                       WHERE ja.start_execution_date IS NOT NULL
                       AND ja.stop_execution_date IS NULL) AS running,
                      (SELECT COUNT(*) FROM msdb.dbo.sysjobhistory h
                       JOIN msdb.dbo.sysjobs j ON h.job_id = j.job_id
                       WHERE h.run_status = 0
                       AND DATEDIFF(HOUR,
                           CAST(CAST(h.run_date AS VARCHAR) + ' ' +
                                STUFF(STUFF(RIGHT('000000' + CAST(h.run_time AS VARCHAR), 6),
                                3, 0, ':'), 6, 0, ':') AS DATETIME),
                           GETDATE()) < 1) AS failed_last_hour
              """)
              if isinstance(result, dict) and "content" in result:
                  for item in result["content"]:
                      if item.get("type") == "text":
                          data = json.loads(item["text"]) if isinstance(item["text"], str) else item["text"]
                          if isinstance(data, dict) and "rows" in data and data["rows"]:
                              running = data["rows"][0][0]
                              failed = data["rows"][0][1]
                          elif isinstance(data, list) and data:
                              running = data[0].get("running", 0)
                              failed = data[0].get("failed_last_hour", 0)
                          else:
                              running, failed = 0, 0
                          checks["checks"]["batch_jobs"] = {
                              "running": running, "failed_last_hour": failed,
                              "status": "CRITICAL" if failed > 2 else ("WARNING" if failed > 0 else "OK")
                          }
                          break
              else:
                  checks["checks"]["batch_jobs"] = {"status": "OK", "raw": str(result)[:300]}
          except Exception as e:
              checks["checks"]["batch_jobs"] = {"status": "WARNING", "error": str(e)}

      # --- Fraicheur des donnees (via MCP analyze_data_freshness) ---
      if checks["checks"].get("mcp_connection", {}).get("status") == "OK":
          try:
              result = mcp_call("analyze_data_freshness", {"domain": "production"})
              checks["checks"]["data_freshness"] = {"status": "OK", "detail": str(result)[:500]}
          except Exception as e:
              checks["checks"]["data_freshness"] = {"status": "WARNING", "error": str(e)}

      # --- Derniere sauvegarde ---
      if checks["checks"].get("mcp_connection", {}).get("status") == "OK":
          try:
              result = mcp_query("""
                  SELECT TOP 1 backup_finish_date, type, backup_size / 1048576 AS size_mb
                  FROM msdb.dbo.backupset
                  WHERE database_name = 'Y2_MSC_MAROC'
                  ORDER BY backup_finish_date DESC
              """)
              if isinstance(result, dict) and "content" in result:
                  for item in result["content"]:
                      if item.get("type") == "text":
                          data = json.loads(item["text"]) if isinstance(item["text"], str) else item["text"]
                          checks["checks"]["last_backup"] = {"status": "OK", "detail": data}
                          break
              else:
                  checks["checks"]["last_backup"] = {"status": "OK", "raw": str(result)[:300]}
          except Exception as e:
              checks["checks"]["last_backup"] = {"status": "WARNING", "error": str(e)}

      # --- Statut global ---
      statuses = [c.get("status", "OK") for c in checks["checks"].values() if isinstance(c, dict)]
      if any(s == "CRITICAL" for s in statuses):
          checks["overall_status"] = "CRITICAL"
      elif any(s == "WARNING" for s in statuses):
          checks["overall_status"] = "DEGRADED"

      from kestra import Kestra
      Kestra.outputs({"cegid_health": json.dumps(checks)})
      print(json.dumps(checks, indent=2))

  # -------------------------------------------------------------------------
  # 2. Check Sage X3
  # -------------------------------------------------------------------------
  - id: check_sage_x3
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: automit/python-erp:3.12
    env:
      X3_MCP_URL: "{{ secret('X3_MCP_URL') }}"
      X3_MCP_TOKEN: "{{ secret('X3_MCP_TOKEN') }}"
    script: |
      import json
      import os
      import time
      from datetime import datetime

      mcp_url = os.environ["X3_MCP_URL"]
      mcp_token = os.environ["X3_MCP_TOKEN"]
      headers = {"X-MCP-TOKEN": mcp_token, "Content-Type": "application/json", "Accept": "application/json"}

      checks = {
          "timestamp": datetime.utcnow().isoformat() + "Z",
          "erp": "sage_x3",
          "checks": {},
          "overall_status": "HEALTHY"
      }

      import requests

      # Teste la connectivite MCP x3-oracle
      try:
          t0 = time.time()
          resp = requests.get(
              mcp_url.rstrip("/"),
              headers=headers,
              timeout=15
          )
          response_ms = round((time.time() - t0) * 1000)
          checks["checks"]["mcp_connection"] = {
              "status": "OK" if resp.status_code < 400 else "CRITICAL",
              "response_time_ms": response_ms,
              "http_status": resp.status_code
          }
      except Exception as e:
          checks["checks"]["mcp_connection"] = {
              "status": "CRITICAL",
              "error": str(e)
          }
          checks["overall_status"] = "CRITICAL"

      # Appel MCP tools/call pour obtenir le health status X3
      if checks["checks"].get("mcp_connection", {}).get("status") == "OK":
          try:
              # Appel JSON-RPC au MCP server
              rpc_payload = {
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "tools/call",
                  "params": {
                      "name": "health_check",
                      "arguments": {}
                  }
              }
              resp = requests.post(
                  mcp_url.rstrip("/"),
                  json=rpc_payload,
                  headers=headers,
                  timeout=30
              )
              if resp.status_code == 200:
                  data = resp.json()
                  if "result" in data:
                      checks["checks"]["x3_health"] = {
                          "status": "OK",
                          "detail": data["result"]
                      }
                  else:
                      checks["checks"]["x3_health"] = {
                          "status": "OK",
                          "detail": data
                      }
              else:
                  checks["checks"]["x3_health"] = {
                      "status": "WARNING",
                      "http_status": resp.status_code,
                      "body": resp.text[:500]
                  }
          except Exception as e:
              checks["checks"]["x3_health"] = {
                  "status": "WARNING",
                  "error": str(e)
              }

      # Statut global
      statuses = [c.get("status", "OK") for c in checks["checks"].values() if isinstance(c, dict)]
      if any(s == "CRITICAL" for s in statuses):
          checks["overall_status"] = "CRITICAL"
      elif any(s == "WARNING" for s in statuses):
          checks["overall_status"] = "DEGRADED"

      from kestra import Kestra
      Kestra.outputs({"sage_health": json.dumps(checks)})
      print(json.dumps(checks, indent=2))

  # -------------------------------------------------------------------------
  # 3. Check Microsoft 365 (Graph API)
  # -------------------------------------------------------------------------
  - id: check_m365
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: automit/python-erp:3.12
    script: |
      import json
      from datetime import datetime

      # TODO: Implémenter via Microsoft Graph API
      # Nécessite: App Registration Azure AD + Client Secret
      checks = {
          "timestamp": datetime.utcnow().isoformat() + "Z",
          "service": "microsoft_365",
          "checks": {
              "exchange_online": {"status": "OK"},
              "sharepoint": {"status": "OK"},
              "teams": {"status": "OK"},
              "intune": {"status": "OK"},
              "license_usage": {
                  "total": 150,
                  "assigned": 132,
                  "available": 18,
                  "status": "OK"
              },
              "conditional_access_alerts": 0
          },
          "overall_status": "HEALTHY"
      }

      from kestra import Kestra
      Kestra.outputs({"m365_health": json.dumps(checks)})
      print(json.dumps(checks, indent=2))

  # -------------------------------------------------------------------------
  # 4. Agrégation + envoi vers ZeroClaw pour analyse
  # -------------------------------------------------------------------------
  - id: aggregate_and_forward
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: automit/python-erp:3.12
    script: |
      import json
      import os
      import requests
      from datetime import datetime

      # Agréger les résultats
      report = {
          "timestamp": datetime.utcnow().isoformat() + "Z",
          "source": "kestra/erp-health-check",
          "execution_id": "{{ execution.id }}",
          "systems": {
              "cegid": json.loads('''{{ outputs.check_cegid.vars.cegid_health }}'''),
              "sage_x3": json.loads('''{{ outputs.check_sage_x3.vars.sage_health }}'''),
              "m365": json.loads('''{{ outputs.check_m365.vars.m365_health }}''')
          }
      }

      # Déterminer le statut global
      statuses = [
          report["systems"]["cegid"]["overall_status"],
          report["systems"]["sage_x3"]["overall_status"],
          report["systems"]["m365"]["overall_status"]
      ]

      if all(s == "HEALTHY" for s in statuses):
          report["global_status"] = "ALL_HEALTHY"
      elif any(s == "CRITICAL" for s in statuses):
          report["global_status"] = "CRITICAL"
      else:
          report["global_status"] = "DEGRADED"

      print(json.dumps(report, indent=2))

      # Envoyer au ZeroClaw gateway pour analyse proactive
      zeroclaw_url = os.getenv("ZEROCLAW_GATEWAY_URL",
                                "http://zeroclaw-erp-agent:42617")
      try:
          # Envoyer via webhook interne
          resp = requests.post(
              f"{zeroclaw_url}/webhook",
              json={"message": json.dumps(report)},
              headers={"Authorization": f"Bearer {os.getenv('ZEROCLAW_TOKEN', '')}"},
              timeout=10
          )
          print(f"📡 Envoyé à ZeroClaw: {resp.status_code}")
      except Exception as e:
          print(f"⚠️ ZeroClaw non joignable: {e} — pas bloquant")

      from kestra import Kestra
      Kestra.outputs({"global_status": report["global_status"]})

triggers:
  # Surveillance périodique toutes les 5 minutes
  - id: scheduled_health
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"

  # Webhook pour déclencher un check ad-hoc
  - id: adhoc_check
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('WEBHOOK_KEY_HEALTH_CHECK') }}"
