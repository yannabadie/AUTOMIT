# =============================================================================
# FLOW: ERP Health Check — Surveillance continue
# Triggered by: Schedule (cron 5min) + ZeroClaw webhook
# Action: Collecte métriques ERP, détecte anomalies, alimente l'agent
# Autonomy Level: Observation (pas d'action corrective)
# =============================================================================
id: erp-health-check
namespace: motherson.it.erp

description: |
  Surveillance santé ERP — collecte métriques CEGID & Sage X3 toutes les 5 min.
  Les résultats sont envoyés au gateway ZeroClaw pour analyse proactive.
  Ce flow ne prend AUCUNE action corrective — il observe et remonte.

labels:
  team: it-ops
  criticality: high
  autonomy: observation
  erp: cegid-sage

tasks:
  # -------------------------------------------------------------------------
  # 1. Check CEGID XRP Sprint (via MCP cegid-oracle)
  # Accès SQL read-only via le MCP server — pas de connexion directe
  # -------------------------------------------------------------------------
  - id: check_cegid
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: automit/python-erp:3.12
    env:
      CEGID_MCP_URL: "{{ secret('MCP_CEGID_ORACLE_URL') }}"
      CEGID_MCP_TOKEN: "{{ secret('MCP_CEGID_ORACLE_TOKEN') }}"
    script: |
      import json
      import os
      import time
      import requests
      from datetime import datetime
      from lib.mcp_client import mcp_call, mcp_query

      mcp_url = os.environ["CEGID_MCP_URL"]
      mcp_token = os.environ["CEGID_MCP_TOKEN"]

      checks = {
          "timestamp": datetime.utcnow().isoformat() + "Z",
          "erp": "cegid",
          "checks": {},
          "overall_status": "HEALTHY"
      }

      # --- Test connexion MCP ---
      try:
          t0 = time.time()
          mcp_headers = {"X-MCP-TOKEN": mcp_token, "Content-Type": "application/json", "Accept": "application/json"}
          resp = requests.get(mcp_url.rstrip("/"), headers=mcp_headers, timeout=15)
          response_ms = round((time.time() - t0) * 1000)
          checks["checks"]["mcp_connection"] = {
              "status": "OK" if resp.status_code < 500 else "CRITICAL",
              "response_time_ms": response_ms
          }
      except Exception as e:
          checks["checks"]["mcp_connection"] = {"status": "CRITICAL", "error": str(e)}
          checks["overall_status"] = "CRITICAL"

      # --- Sessions actives ---
      if checks["checks"].get("mcp_connection", {}).get("status") == "OK":
          try:
              result = mcp_query(mcp_url, mcp_token,
                  "SELECT COUNT(*) AS cnt FROM sys.dm_exec_sessions WHERE is_user_process = 1"
              )
              # Parse result — MCP returns content array with text
              if isinstance(result, dict) and "content" in result:
                  for item in result["content"]:
                      if item.get("type") == "text":
                          data = json.loads(item["text"]) if isinstance(item["text"], str) else item["text"]
                          if isinstance(data, dict) and "rows" in data:
                              count = data["rows"][0][0] if data["rows"] else 0
                          elif isinstance(data, list) and data:
                              count = data[0].get("cnt", data[0].get("", 0))
                          else:
                              count = data
                          checks["checks"]["active_sessions"] = {
                              "count": count, "max_allowed": 50,
                              "status": "WARNING" if isinstance(count, int) and count > 40 else "OK"
                          }
                          break
              else:
                  checks["checks"]["active_sessions"] = {"status": "OK", "raw": str(result)[:300]}
          except Exception as e:
              checks["checks"]["active_sessions"] = {"status": "WARNING", "error": str(e)}

      # --- Jobs batch ---
      if checks["checks"].get("mcp_connection", {}).get("status") == "OK":
          try:
              result = mcp_query(mcp_url, mcp_token, """
                  SELECT
                      (SELECT COUNT(*) FROM msdb.dbo.sysjobactivity ja
                       JOIN msdb.dbo.sysjobs j ON ja.job_id = j.job_id
                       WHERE ja.start_execution_date IS NOT NULL
                       AND ja.stop_execution_date IS NULL) AS running,
                      (SELECT COUNT(*) FROM msdb.dbo.sysjobhistory h
                       JOIN msdb.dbo.sysjobs j ON h.job_id = j.job_id
                       WHERE h.run_status = 0
                       AND DATEDIFF(HOUR,
                           CAST(CAST(h.run_date AS VARCHAR) + ' ' +
                                STUFF(STUFF(RIGHT('000000' + CAST(h.run_time AS VARCHAR), 6),
                                3, 0, ':'), 6, 0, ':') AS DATETIME),
                           GETDATE()) < 1) AS failed_last_hour
              """)
              if isinstance(result, dict) and "content" in result:
                  for item in result["content"]:
                      if item.get("type") == "text":
                          data = json.loads(item["text"]) if isinstance(item["text"], str) else item["text"]
                          if isinstance(data, dict) and "rows" in data and data["rows"]:
                              running = data["rows"][0][0]
                              failed = data["rows"][0][1]
                          elif isinstance(data, list) and data:
                              running = data[0].get("running", 0)
                              failed = data[0].get("failed_last_hour", 0)
                          else:
                              running, failed = 0, 0
                          checks["checks"]["batch_jobs"] = {
                              "running": running, "failed_last_hour": failed,
                              "status": "CRITICAL" if failed > 2 else ("WARNING" if failed > 0 else "OK")
                          }
                          break
              else:
                  checks["checks"]["batch_jobs"] = {"status": "OK", "raw": str(result)[:300]}
          except Exception as e:
              checks["checks"]["batch_jobs"] = {"status": "WARNING", "error": str(e)}

      # --- Fraicheur des donnees (via MCP analyze_data_freshness) ---
      if checks["checks"].get("mcp_connection", {}).get("status") == "OK":
          try:
              result = mcp_call(mcp_url, mcp_token, "analyze_data_freshness", {"domain": "production"})
              checks["checks"]["data_freshness"] = {"status": "OK", "detail": str(result)[:500]}
          except Exception as e:
              checks["checks"]["data_freshness"] = {"status": "WARNING", "error": str(e)}

      # --- Derniere sauvegarde ---
      if checks["checks"].get("mcp_connection", {}).get("status") == "OK":
          try:
              result = mcp_query(mcp_url, mcp_token, """
                  SELECT TOP 1 backup_finish_date, type, backup_size / 1048576 AS size_mb
                  FROM msdb.dbo.backupset
                  WHERE database_name = 'Y2_MSC_MAROC'
                  ORDER BY backup_finish_date DESC
              """)
              if isinstance(result, dict) and "content" in result:
                  for item in result["content"]:
                      if item.get("type") == "text":
                          data = json.loads(item["text"]) if isinstance(item["text"], str) else item["text"]
                          checks["checks"]["last_backup"] = {"status": "OK", "detail": data}
                          break
              else:
                  checks["checks"]["last_backup"] = {"status": "OK", "raw": str(result)[:300]}
          except Exception as e:
              checks["checks"]["last_backup"] = {"status": "WARNING", "error": str(e)}

      # --- Statut global ---
      statuses = [c.get("status", "OK") for c in checks["checks"].values() if isinstance(c, dict)]
      if any(s == "CRITICAL" for s in statuses):
          checks["overall_status"] = "CRITICAL"
      elif any(s == "WARNING" for s in statuses):
          checks["overall_status"] = "DEGRADED"

      from kestra import Kestra
      Kestra.outputs({"cegid_health": json.dumps(checks)})
      print(json.dumps(checks, indent=2))

  # -------------------------------------------------------------------------
  # 2. Check Sage X3
  # -------------------------------------------------------------------------
  - id: check_sage_x3
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: automit/python-erp:3.12
    env:
      X3_MCP_URL: "{{ secret('X3_MCP_URL') }}"
      X3_MCP_TOKEN: "{{ secret('X3_MCP_TOKEN') }}"
    script: |
      import json
      import os
      import time
      from datetime import datetime

      mcp_url = os.environ["X3_MCP_URL"]
      mcp_token = os.environ["X3_MCP_TOKEN"]
      headers = {"X-MCP-TOKEN": mcp_token, "Content-Type": "application/json", "Accept": "application/json"}

      checks = {
          "timestamp": datetime.utcnow().isoformat() + "Z",
          "erp": "sage_x3",
          "checks": {},
          "overall_status": "HEALTHY"
      }

      import requests

      # Teste la connectivite MCP x3-oracle
      try:
          t0 = time.time()
          resp = requests.get(
              mcp_url.rstrip("/"),
              headers=headers,
              timeout=15
          )
          response_ms = round((time.time() - t0) * 1000)
          checks["checks"]["mcp_connection"] = {
              "status": "OK" if resp.status_code < 400 else "CRITICAL",
              "response_time_ms": response_ms,
              "http_status": resp.status_code
          }
      except Exception as e:
          checks["checks"]["mcp_connection"] = {
              "status": "CRITICAL",
              "error": str(e)
          }
          checks["overall_status"] = "CRITICAL"

      # Appel MCP tools/call pour obtenir le health status X3
      if checks["checks"].get("mcp_connection", {}).get("status") == "OK":
          try:
              # Appel JSON-RPC au MCP server
              rpc_payload = {
                  "jsonrpc": "2.0",
                  "id": 1,
                  "method": "tools/call",
                  "params": {
                      "name": "health_check",
                      "arguments": {}
                  }
              }
              resp = requests.post(
                  mcp_url.rstrip("/"),
                  json=rpc_payload,
                  headers=headers,
                  timeout=30
              )
              if resp.status_code == 200:
                  data = resp.json()
                  if "result" in data:
                      checks["checks"]["x3_health"] = {
                          "status": "OK",
                          "detail": data["result"]
                      }
                  else:
                      checks["checks"]["x3_health"] = {
                          "status": "OK",
                          "detail": data
                      }
              else:
                  checks["checks"]["x3_health"] = {
                      "status": "WARNING",
                      "http_status": resp.status_code,
                      "body": resp.text[:500]
                  }
          except Exception as e:
              checks["checks"]["x3_health"] = {
                  "status": "WARNING",
                  "error": str(e)
              }

      # Statut global
      statuses = [c.get("status", "OK") for c in checks["checks"].values() if isinstance(c, dict)]
      if any(s == "CRITICAL" for s in statuses):
          checks["overall_status"] = "CRITICAL"
      elif any(s == "WARNING" for s in statuses):
          checks["overall_status"] = "DEGRADED"

      from kestra import Kestra
      Kestra.outputs({"sage_health": json.dumps(checks)})
      print(json.dumps(checks, indent=2))

  # -------------------------------------------------------------------------
  # 3. Check Microsoft 365 (Graph API)
  # -------------------------------------------------------------------------
  - id: check_m365
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: automit/python-erp:3.12
    env:
      AZURE_TENANT_ID: "{{ secret('AZURE_TENANT_ID') }}"
      AZURE_CLIENT_ID: "{{ secret('AZURE_CLIENT_ID') }}"
      AZURE_CLIENT_SECRET: "{{ secret('AZURE_CLIENT_SECRET') }}"
    script: |
      import json
      import os
      import requests
      from datetime import datetime
      from lib.mcp_client import get_graph_token
      from lib.logging import log_info, log_warn, log_error

      checks = {
          "timestamp": datetime.utcnow().isoformat() + "Z",
          "service": "microsoft_365",
          "checks": {},
          "overall_status": "HEALTHY"
      }

      tenant = os.environ.get("AZURE_TENANT_ID", "")
      client_id = os.environ.get("AZURE_CLIENT_ID", "")
      client_secret = os.environ.get("AZURE_CLIENT_SECRET", "")

      if not all([tenant, client_id, client_secret]):
          log_warn("Entra ID credentials non configurees — mode degrade", service="m365")
          checks["checks"]["auth"] = {"status": "WARNING", "detail": "AZURE_TENANT_ID/CLIENT_ID/CLIENT_SECRET non configures"}
          checks["overall_status"] = "DEGRADED"
      else:
          # --- Obtenir un token Graph API ---
          try:
              access_token = get_graph_token(tenant, client_id, client_secret)
              headers = {"Authorization": f"Bearer {access_token}", "Accept": "application/json"}
              checks["checks"]["auth"] = {"status": "OK", "detail": "Token Graph API obtenu"}
          except Exception as e:
              checks["checks"]["auth"] = {"status": "CRITICAL", "error": str(e)[:300]}
              checks["overall_status"] = "CRITICAL"
              access_token = None

          if access_token:
              # --- Service Health (Exchange, SharePoint, Teams) ---
              try:
                  resp = requests.get(
                      "https://graph.microsoft.com/v1.0/admin/serviceAnnouncement/healthOverviews",
                      headers=headers, timeout=15
                  )
                  if resp.status_code == 200:
                      services = resp.json().get("value", [])
                      service_health = {}
                      for svc in services:
                          svc_id = svc.get("id", svc.get("service", "unknown"))
                          svc_status = svc.get("status", "unknown")
                          # Mapping Graph status to our status
                          if svc_status in ("serviceOperational", "serviceDegradation"):
                              status = "OK" if svc_status == "serviceOperational" else "WARNING"
                          elif svc_status in ("serviceInterruption", "extendedRecovery"):
                              status = "CRITICAL"
                          else:
                              status = "OK"
                          service_health[svc_id] = {"status": status, "graph_status": svc_status}

                      # Extraire les services cles
                      key_services = {
                          "exchange_online": "Exchange Online",
                          "sharepoint_online": "SharePoint Online",
                          "microsoft_teams": "Microsoft Teams",
                          "microsoft_intune": "Microsoft Intune"
                      }
                      for key, name in key_services.items():
                          match = next((v for k, v in service_health.items() if name.lower() in k.lower()), None)
                          checks["checks"][key] = match or {"status": "OK", "detail": "Non trouve dans healthOverviews"}

                      checks["checks"]["service_health_total"] = len(services)
                  elif resp.status_code == 403:
                      checks["checks"]["service_health"] = {
                          "status": "WARNING",
                          "detail": "Permission ServiceHealth.Read.All requise"
                      }
                  else:
                      checks["checks"]["service_health"] = {
                          "status": "WARNING",
                          "http_status": resp.status_code,
                          "detail": resp.text[:300]
                      }
              except Exception as e:
                  checks["checks"]["service_health"] = {"status": "WARNING", "error": str(e)[:200]}

              # --- Licences M365 ---
              try:
                  resp = requests.get(
                      "https://graph.microsoft.com/v1.0/subscribedSkus",
                      headers=headers, timeout=15
                  )
                  if resp.status_code == 200:
                      skus = resp.json().get("value", [])
                      total_licenses = 0
                      assigned_licenses = 0
                      license_details = []
                      for sku in skus:
                          if sku.get("capabilityStatus") == "Enabled":
                              total = sku.get("prepaidUnits", {}).get("enabled", 0)
                              consumed = sku.get("consumedUnits", 0)
                              total_licenses += total
                              assigned_licenses += consumed
                              license_details.append({
                                  "sku": sku.get("skuPartNumber", "?"),
                                  "total": total,
                                  "consumed": consumed,
                                  "available": total - consumed
                              })
                      available = total_licenses - assigned_licenses
                      usage_pct = round(assigned_licenses / total_licenses * 100, 1) if total_licenses > 0 else 0
                      checks["checks"]["license_usage"] = {
                          "total": total_licenses,
                          "assigned": assigned_licenses,
                          "available": available,
                          "usage_percent": usage_pct,
                          "status": "CRITICAL" if usage_pct > 95 else ("WARNING" if usage_pct > 85 else "OK"),
                          "details": license_details[:10]
                      }
                  elif resp.status_code == 403:
                      checks["checks"]["license_usage"] = {
                          "status": "WARNING",
                          "detail": "Permission Organization.Read.All requise"
                      }
                  else:
                      checks["checks"]["license_usage"] = {
                          "status": "WARNING",
                          "http_status": resp.status_code
                      }
              except Exception as e:
                  checks["checks"]["license_usage"] = {"status": "WARNING", "error": str(e)[:200]}

              # --- Alertes securite recentes ---
              try:
                  resp = requests.get(
                      "https://graph.microsoft.com/v1.0/security/alerts_v2?$top=10&$orderby=createdDateTime desc",
                      headers=headers, timeout=15
                  )
                  if resp.status_code == 200:
                      alerts = resp.json().get("value", [])
                      high_alerts = [a for a in alerts if a.get("severity") in ("high", "critical")]
                      checks["checks"]["security_alerts"] = {
                          "total_recent": len(alerts),
                          "high_critical": len(high_alerts),
                          "status": "CRITICAL" if len(high_alerts) > 0 else "OK"
                      }
                  elif resp.status_code == 403:
                      checks["checks"]["security_alerts"] = {
                          "status": "WARNING",
                          "detail": "Permission SecurityEvents.Read.All requise"
                      }
                  else:
                      checks["checks"]["security_alerts"] = {"status": "OK", "detail": "API non accessible"}
              except Exception as e:
                  checks["checks"]["security_alerts"] = {"status": "WARNING", "error": str(e)[:200]}

              # --- Utilisateurs risques (Identity Protection) ---
              try:
                  resp = requests.get(
                      "https://graph.microsoft.com/v1.0/identityProtection/riskyUsers?$filter=riskLevel eq 'high'&$top=5",
                      headers=headers, timeout=15
                  )
                  if resp.status_code == 200:
                      risky = resp.json().get("value", [])
                      checks["checks"]["risky_users"] = {
                          "high_risk_count": len(risky),
                          "status": "CRITICAL" if len(risky) > 0 else "OK",
                          "users": [u.get("userPrincipalName", "?") for u in risky[:5]]
                      }
                  elif resp.status_code == 403:
                      checks["checks"]["risky_users"] = {
                          "status": "WARNING",
                          "detail": "Permission IdentityRiskyUser.Read.All requise (P2 requis)"
                      }
                  else:
                      checks["checks"]["risky_users"] = {"status": "OK", "detail": "Non disponible"}
              except Exception as e:
                  checks["checks"]["risky_users"] = {"status": "WARNING", "error": str(e)[:200]}

      # --- Statut global ---
      statuses = [c.get("status", "OK") for c in checks["checks"].values() if isinstance(c, dict)]
      if any(s == "CRITICAL" for s in statuses):
          checks["overall_status"] = "CRITICAL"
      elif any(s == "WARNING" for s in statuses):
          checks["overall_status"] = "DEGRADED"

      from kestra import Kestra
      Kestra.outputs({"m365_health": json.dumps(checks)})
      print(json.dumps(checks, indent=2))

  # -------------------------------------------------------------------------
  # 4. Agrégation + envoi vers ZeroClaw pour analyse
  # -------------------------------------------------------------------------
  - id: aggregate_and_forward
    type: io.kestra.plugin.scripts.python.Script
    taskRunner:
      type: io.kestra.plugin.scripts.runner.docker.Docker
      containerImage: automit/python-erp:3.12
    script: |
      import json
      import os
      import requests
      from datetime import datetime
      from lib.logging import log_info, log_warn, log_error

      # Agréger les résultats
      report = {
          "timestamp": datetime.utcnow().isoformat() + "Z",
          "source": "kestra/erp-health-check",
          "execution_id": "{{ execution.id }}",
          "systems": {
              "cegid": json.loads('''{{ outputs.check_cegid.vars.cegid_health }}'''),
              "sage_x3": json.loads('''{{ outputs.check_sage_x3.vars.sage_health }}'''),
              "m365": json.loads('''{{ outputs.check_m365.vars.m365_health }}''')
          }
      }

      # Déterminer le statut global
      statuses = [
          report["systems"]["cegid"]["overall_status"],
          report["systems"]["sage_x3"]["overall_status"],
          report["systems"]["m365"]["overall_status"]
      ]

      if all(s == "HEALTHY" for s in statuses):
          report["global_status"] = "ALL_HEALTHY"
      elif any(s == "CRITICAL" for s in statuses):
          report["global_status"] = "CRITICAL"
      else:
          report["global_status"] = "DEGRADED"

      print(json.dumps(report, indent=2))

      # --- Pousser les metriques vers Prometheus Pushgateway ---
      pushgw_url = os.getenv("PUSHGATEWAY_URL", "http://pushgateway:9091")
      status_map = {"HEALTHY": 2, "DEGRADED": 1, "CRITICAL": 0}
      try:
          metrics_lines = []

          # Statut global par systeme
          for sys_name in ("cegid", "sage_x3", "m365"):
              sys_data = report["systems"].get(sys_name, {})
              val = status_map.get(sys_data.get("overall_status", "HEALTHY"), 2)
              metrics_lines.append(f'automit_erp_health{{system="{sys_name}"}} {val}')

          # M365 health
          m365 = report["systems"].get("m365", {})
          m365_val = status_map.get(m365.get("overall_status", "HEALTHY"), 2)
          metrics_lines.append(f"automit_m365_health {m365_val}")

          # CEGID details
          cegid = report["systems"].get("cegid", {})
          cegid_checks = cegid.get("checks", {})
          # Sessions actives
          sessions = cegid_checks.get("active_sessions", {})
          if isinstance(sessions, dict) and isinstance(sessions.get("count"), (int, float)):
              metrics_lines.append(f"automit_cegid_active_sessions {sessions['count']}")
          # Jobs en echec
          jobs = cegid_checks.get("batch_jobs", {})
          if isinstance(jobs, dict):
              if isinstance(jobs.get("failed_last_hour"), (int, float)):
                  metrics_lines.append(f"automit_cegid_failed_jobs_last_hour {jobs['failed_last_hour']}")
          # MCP response time
          mcp_conn = cegid_checks.get("mcp_connection", {})
          if isinstance(mcp_conn, dict) and isinstance(mcp_conn.get("response_time_ms"), (int, float)):
              metrics_lines.append(f'automit_mcp_response_time_ms{{server="cegid"}} {mcp_conn["response_time_ms"]}')

          # Sage X3 MCP response time
          x3 = report["systems"].get("sage_x3", {})
          x3_mcp = x3.get("checks", {}).get("mcp_connection", {})
          if isinstance(x3_mcp, dict) and isinstance(x3_mcp.get("response_time_ms"), (int, float)):
              metrics_lines.append(f'automit_mcp_response_time_ms{{server="sage_x3"}} {x3_mcp["response_time_ms"]}')

          # M365 licences
          m365_checks = m365.get("checks", {})
          lic = m365_checks.get("license_usage", {})
          if isinstance(lic, dict):
              if isinstance(lic.get("total"), (int, float)):
                  metrics_lines.append(f"automit_m365_licenses_total {lic['total']}")
              if isinstance(lic.get("assigned"), (int, float)):
                  metrics_lines.append(f"automit_m365_licenses_assigned {lic['assigned']}")
              if isinstance(lic.get("usage_percent"), (int, float)):
                  metrics_lines.append(f"automit_m365_license_usage_percent {lic['usage_percent']}")
          # Security alerts
          sec = m365_checks.get("security_alerts", {})
          if isinstance(sec, dict) and isinstance(sec.get("high_critical"), (int, float)):
              metrics_lines.append(f"automit_m365_security_alerts_high {sec['high_critical']}")

          # Push to Pushgateway
          payload = "\n".join(metrics_lines) + "\n"
          resp = requests.post(
              f"{pushgw_url}/metrics/job/automit_health_check",
              data=payload,
              headers={"Content-Type": "text/plain"},
              timeout=5
          )
          log_info("Metriques poussees vers Pushgateway", status_code=resp.status_code, metric_count=len(metrics_lines))
      except Exception as e:
          log_warn("Pushgateway non joignable — pas bloquant", error=str(e))

      # --- Envoyer au ZeroClaw gateway pour analyse proactive ---
      zeroclaw_url = os.getenv("ZEROCLAW_GATEWAY_URL",
                                "http://zeroclaw-erp-agent:42617")
      try:
          resp = requests.post(
              f"{zeroclaw_url}/webhook",
              json={"message": json.dumps(report)},
              headers={"Authorization": f"Bearer {os.getenv('ZEROCLAW_TOKEN', '')}"},
              timeout=10
          )
          log_info("Rapport envoye a ZeroClaw", status_code=resp.status_code)
      except Exception as e:
          log_warn("ZeroClaw non joignable — pas bloquant", error=str(e))

      from kestra import Kestra
      Kestra.outputs({"global_status": report["global_status"]})

triggers:
  # Surveillance périodique toutes les 5 minutes
  - id: scheduled_health
    type: io.kestra.plugin.core.trigger.Schedule
    cron: "*/5 * * * *"

  # Webhook pour déclencher un check ad-hoc
  - id: adhoc_check
    type: io.kestra.plugin.core.trigger.Webhook
    key: "{{ secret('WEBHOOK_KEY_HEALTH_CHECK') }}"
